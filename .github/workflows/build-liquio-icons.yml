name: Build Liquio icons
on:
  push:
    paths:
      - 'public/assets/liquio/icon-source.png'
      - 'public/assets/favicon.svg'
      - 'scripts/generate-liquio-icons.py'
      - '.github/workflows/build-liquio-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2
      - name: Generate deterministic icons
        run: python scripts/generate-liquio-icons.py
      - name: Validate generated icon files
        run: node scripts/validate-liquio-icons.mjs
      - name: Commit icon outputs
        run: |
          git add public/assets/apple-touch-icon.png public/assets/icon-192.png public/assets/icon-512.png public/assets/favicon-32.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: generate Liquio iOS Android and browser icons"
            git push
          fi
