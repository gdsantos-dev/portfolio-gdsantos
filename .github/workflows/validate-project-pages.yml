name: Validate portfolio project pages
on:
  push:
    paths:
      - "public/**"
      - "scripts/validate-project-showcase.mjs"
      - "scripts/validate-section-tracker.mjs"
      - "scripts/validate-liquio.mjs"
      - "scripts/validate-project-seo.mjs"
      - "scripts/project-seo.mjs"
      - "server.mjs"
      - "Dockerfile"
      - ".github/workflows/validate-project-pages.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/validate-project-showcase.mjs"
      - "scripts/validate-section-tracker.mjs"
      - "scripts/validate-liquio.mjs"
      - "scripts/validate-project-seo.mjs"
      - "scripts/project-seo.mjs"
      - "server.mjs"
      - "Dockerfile"
      - ".github/workflows/validate-project-pages.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check public/main.js
          node --check public/projects-cinema.js
          node --check public/project-case.js
          node --check public/section-tracker.js
          node --check scripts/project-seo.mjs
          node --check server.mjs
      - name: Project content and routes
        run: node scripts/validate-project-showcase.mjs
      - name: Live SEO and sitemap checks
        run: node scripts/validate-project-seo.mjs
      - name: Homepage scroll URL state
        run: node scripts/validate-section-tracker.mjs
      - name: Liquio distribution and contact isolation
        run: node scripts/validate-liquio.mjs
      - name: Docker production smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker build -t gds-portfolio-smoke .
          docker run -d --name gds-portfolio-smoke -p 127.0.0.1:3100:3000 gds-portfolio-smoke
          trap 'docker logs gds-portfolio-smoke; docker rm -f gds-portfolio-smoke' EXIT
          docker exec gds-portfolio-smoke test -r /app/scripts/project-seo.mjs
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" -eq 1
          curl -fsS 'http://127.0.0.1:3100/pt/projeto/?id=scoutliq' | grep -Fq '<title>ScoutLIQ | Guilherme Santos</title>'
          curl -fsS 'http://127.0.0.1:3100/en/projeto/?id=dashliq' | grep -Fq '<title>DashLIQ | Guilherme Santos</title>'
          curl -fsS 'http://127.0.0.1:3100/sitemap.xml' | grep -Fq 'id=scoutliq'


          curl -fsS 'http://127.0.0.1:3100/assets/liquio/1.0.0/liquio.js' >/dev/null
          curl -fsS 'http://127.0.0.1:3100/assets/liquio/1.0.0/sprites/liquio.png' >/dev/null
