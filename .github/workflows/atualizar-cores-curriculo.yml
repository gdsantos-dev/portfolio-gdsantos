name: Gerar curriculos PT EN ES

on:
  push:
    paths:
      - 'scripts/gerar_curriculo.py'
      - 'scripts/gerar_curriculos_traduzidos.py'
      - '.github/workflows/atualizar-cores-curriculo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-curriculos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 pymupdf==1.26.5
      - name: Gerar os tres documentos editaveis
        run: |
          python scripts/gerar_curriculo.py
          python scripts/gerar_curriculos_traduzidos.py
      - name: Instalar conversor PDF se necessario
        run: |
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer
          fi
      - name: Gerar PDF em cada idioma
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo-curriculos-${{ github.run_id }} --headless --convert-to pdf --outdir public/data/curriculos public/data/curriculos/*.docx
      - name: Validar documentos PDF e links
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          directory = Path('public/data/curriculos')
          markers = {
              'pt': ('OBJETIVO PROFISSIONAL', 'HABILIDADES TÉCNICAS', 'IDIOMAS'),
              'en': ('PROFESSIONAL OBJECTIVE', 'TECHNICAL SKILLS', 'LANGUAGES'),
              'es': ('OBJETIVO PROFESIONAL', 'COMPETENCIAS TÉCNICAS', 'IDIOMAS'),
          }
          for locale, phrases in markers.items():
              pdf = directory / f'guilherme-dos-santos-curriculo-{locale}.pdf'
              word = directory / f'guilherme-dos-santos-curriculo-{locale}.docx'
              assert pdf.exists() and word.exists(), f'Missing resume files: {locale}'
              with fitz.open(pdf) as doc:
                  assert len(doc) == 1, f'{locale}: expected one page, got {len(doc)}'
                  page = doc[0]
                  body = page.get_text()
                  for phrase in phrases:
                      assert phrase in body, f'{locale}: missing {phrase}'
                  assert len(page.get_links()) >= 4, f'{locale}: clickable links missing'
                  for block in page.get_text('dict')['blocks']:
                      if block.get('type') != 0: continue
                      for line in block['lines']:
                          for span in line['spans']:
                              x0, y0, x1, y1 = span['bbox']
                              assert min(x0, y0) >= -1 and x1 <= page.rect.width + 1 and y1 <= page.rect.height + 1, f'{locale}: text out of bounds'
              print(locale, 'one page, translated sections, clickable links')
          PY
      - name: Publicar PDF e Word
        run: |
          git add public/data/curriculos/guilherme-dos-santos-curriculo-{pt,en,es}.{pdf,docx}
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: curriculos em tres idiomas PDF e DOCX [skip ci]"
            git push
          fi
