name: Atualizar cores do currículo

on:
  push:
    paths:
      - 'scripts/recolor_curriculo.py'
      - '.github/workflows/atualizar-cores-curriculo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramenta PDF
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Atualizar PDF
        run: python scripts/recolor_curriculo.py
      - name: Registrar versão atualizada
        run: |
          if ! git diff --quiet -- public/data/curriculos/guilherme-dos-santos-curriculo-pt.pdf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/curriculos/guilherme-dos-santos-curriculo-pt.pdf
            git commit -m "style: atualiza currículo para Black & Crimson [skip ci]"
            git push
          fi
